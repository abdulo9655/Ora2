<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Queue Admin</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="bg"></div>



<div class="card">


<div class="icon">
🔐
</div>



<h1>
ADMIN
</h1>


<p>
Queue Control Center
</p>



<div id="login">


<input

id="password"

type="password"

placeholder="รหัสแอดมิน"

>


<button onclick="login()">

เข้าสู่ระบบ

</button>


</div>




<div id="panel" style="display:none;">


<div class="ticket">


<p>
คิวปัจจุบัน
</p>


<h2 id="current">

A000

</h2>


</div>




<button onclick="nextQueue()">

▶ เรียกคิวถัดไป

</button>



<button onclick="refreshQueue()">

🔄 ดูคิวปัจจุบัน

</button>



</div>



</div>



<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbyOf3Ca0vXnSGXZpSv9i26BA_yn_ibAggrp1LYART51w11DEeJE-3veyGlFYyhBysGl0w/exec";




function login(){


const pass =

document.getElementById("password")
.value;



if(pass === "130956"){



document.getElementById("login")
.style.display="none";


document.getElementById("panel")
.style.display="block";



refreshQueue();



}else{


alert("❌ รหัสไม่ถูกต้อง");


}


}




async function nextQueue(){



const res =

await fetch(

API_URL+

"?action=callNext"

);



const data =

await res.json();



document.getElementById("current")
.innerHTML = data.queue;



}




async function refreshQueue(){


const res =

await fetch(

API_URL+

"?action=current"

);



const data =

await res.json();



document.getElementById("current")
.innerHTML=data.queue;



}



</script>


</body>

</html>
