<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waiting Queue</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="bg"></div>



<div class="card">


<div class="icon">
⏳
</div>



<h1>
กำลังรอคิว
</h1>



<p>
หมายเลขคิวของคุณ
</p>



<div class="ticket">


<h2 id="myQueue">
A000
</h2>


<p id="status">

กำลังรอเรียก...

</p>


</div>



</div>




<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbyOf3Ca0vXnSGXZpSv9i26BA_yn_ibAggrp1LYART51w11DEeJE-3veyGlFYyhBysGl0w/exec";



const myQueue =

localStorage.getItem("myQueue");



document.getElementById("myQueue")
.innerHTML = myQueue || "ไม่มีคิว";





// ตรวจสอบทุก 3 วินาที

setInterval(async()=>{


if(!myQueue) return;



const url =

API_URL +

"?action=check&queue=" +

myQueue;



const res =

await fetch(url);



const data =

await res.json();



if(data.isCalled){



document.getElementById("status")
.innerHTML =

"🎉 ถึงคิวของคุณแล้ว<br>กรุณาไปติดต่อที่เคาน์เตอร์";



alert(
"🎉 ถึงคิวของคุณแล้ว\nกรุณาไปติดต่อที่เคาน์เตอร์"
);



}



},3000);



</script>


</body>

</html>
